services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devstrom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devstrom}
      POSTGRES_DB: ${POSTGRES_DB:-devstrom}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - devstrom_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devstrom} -d ${POSTGRES_DB:-devstrom}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migration runner: applies Alembic migrations against `db` before
  # `api` starts. Exits after `alembic upgrade head` completes; `api` waits
  # for it to finish successfully via `service_completed_successfully`.
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devstrom}:${POSTGRES_PASSWORD:-devstrom}@db:5432/${POSTGRES_DB:-devstrom}
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    command: ["uvicorn", "app.api:api", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devstrom}:${POSTGRES_PASSWORD:-devstrom}@db:5432/${POSTGRES_DB:-devstrom}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LANGCHAIN_TRACING: ${LANGCHAIN_TRACING:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-DevStrom}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  ui:
    build: .
    command: ["streamlit", "run", "ui/Home.py", "--server.address=0.0.0.0", "--server.port=8501"]
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8501}:8501"
    environment:
      # Streamlit talks to the API over the compose network, not localhost.
      API_BASE_URL: http://api:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    depends_on:
      api:
        condition: service_started

volumes:
  devstrom_db_data:
