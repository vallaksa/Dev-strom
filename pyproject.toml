[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=app --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/services/db.py",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "migrations/versions"]

[tool.ruff.lint]
# Ruff's default ruleset (pycodestyle E4/E7/E9 + Pyflakes F). Import-sorting
# (I) and pyupgrade (UP) are intentionally left out: enabling them would
# immediately flag pre-existing, out-of-scope style in app/ files owned by a
# concurrent backend-hardening branch, purely for import order/idiom - not
# worth the churn/merge-conflict risk on this devex-only branch.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Pre-existing, deliberate pattern: load_dotenv() must run before importing
# modules that read env vars at import time. Out of scope for this branch
# (P0-4/P0-5 devex work only) - not app/ business logic.
"app/api.py" = ["E402"]
"ui/Home.py" = ["E402"]
"migrations/env.py" = ["E402"]
"scripts/*.py" = ["E402"]
# Pre-existing unused imports in app/services/, out of scope for this branch.
"app/services/run_service.py" = ["F401"]
"app/services/models.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations/", ".venv/"]
disallow_untyped_defs = false
warn_unused_ignores = false
