    <script>
      // Apply the saved colour theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("devstrom.theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    </script>
